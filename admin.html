<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STREET WEAR — Administration</title><link rel="stylesheet" href="style.css"></head><body class="admin-body"><header class="top"><a class="logo" href="index.html">STREET<span>WEAR.</span></a><nav><a href="index.html">Voir la boutique</a></nav><button class="cart-btn" onclick="logoutAdmin()">Déconnexion</button></header>
<div id="adminLogin" class="login-wrap"><form id="loginForm" class="login-card"><p class="eyebrow">ESPACE PRIVÉ</p><h1>Administration</h1><p>Entre le code administrateur pour continuer.</p><input id="adminPassword" type="password" placeholder="Code admin" required><button class="gold-btn full">SE CONNECTER</button><small>Code initial : <b>1234</b> (à changer dans app.js)</small></form></div>
<main id="adminPanel" class="admin-main hidden"><div class="admin-title"><div><p class="eyebrow">CONTROL CENTER</p><h1>Dashboard</h1></div><a class="gold-btn" href="index.html">Ouvrir la boutique ↗</a></div><div class="stats"><div><small>PRODUITS</small><strong id="statProducts">0</strong></div><div><small>CATÉGORIES</small><strong id="statCategories">0</strong></div><div><small>COMMANDES</small><strong id="statOrders">0</strong></div></div>
<div class="admin-grid"><section class="panel"><h2>Gestion des catégories</h2><form id="categoryForm" class="inline-form"><input id="categoryName" placeholder="Nouvelle catégorie" required><button class="gold-btn">Ajouter</button></form><div id="categoryList"></div></section>
<section class="panel"><h2>Ajouter un produit</h2><form id="productForm" class="stack"><input id="productName" placeholder="Nom du produit" required><div class="two"><input id="productPrice" type="number" min="0" placeholder="Prix (DH)" required><select id="productCategory"></select></div><input id="productImage" placeholder="Nom image (ex: 22337157c6a20ec6.webp)"><textarea id="productDescription" placeholder="Description"></textarea><button class="gold-btn">Ajouter le produit</button></form></section></div>
<section class="panel"><h2>Produits</h2><div id="adminProducts"></div></section><section class="panel"><h2>Commandes</h2><div id="adminOrders"></div></section></main><script src="app.js"></script></body></html>
